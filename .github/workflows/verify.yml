name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: SAM infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v3
      - run: sam validate --lint --template-file services/payments-api/template.yaml

  backend-unit:
    name: Payments API unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/payments-api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt -r src/requirements.txt
      - run: python -m pytest tests/unit -q

  backend-integration:
    name: DynamoDB integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/payments-api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt -r src/requirements.txt
      - run: python -m pytest tests/integration/test_dynamodb_payment_flow.py tests/integration/test_import_jobs.py tests/integration/test_import_retention.py tests/integration/test_import_apply.py -q

  frontend:
    name: Frontend workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
